<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Form</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1c5fa8, #4f8edc);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }

      .form-container {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      }

      .form-container h2 {
        text-align: center;
        margin-bottom: 2rem;
        color: #1c5fa8;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #333;
      }

      input,
      select,
      textarea {
        width: 93%;
        padding: 0.8rem 0.9rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
        transition:
          border 0.2s,
          box-shadow 0.2s;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #1c5fa8;
        box-shadow: 0 0 0 2px rgba(28, 95, 168, 0.15);
      }

      textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-row {
        display: flex;
        gap: 3rem;
      }

      .form-row .form-group {
        flex: 1;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.95rem;
        color: #555;
        margin-bottom: 1.5rem;
      }

      .checkbox-group input {
        width: auto;
        height: auto;
        margin: 0;
      }

      .submit-btn {
        width: 100%;
        padding: 0.8rem;
        border: none;
        border-radius: 10px;
        background: #1c5fa8;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .submit-btn:hover {
        background: #154a84;
      }

      .submit-btn:active {
        transform: scale(0.98);
      }

      .success-message {
        margin-top: 1rem;
        font-size: 0.95rem;
        color: #2e7d32;
        text-align: center;
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <h2>Contact Form</h2>
      <form
        id="contactForm"
        action="https://mon.app.n8n.cloud/webhook/form"
        method="post"
      >
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="john@example.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="">-- Select a subject --</option>
            <option value="general">General Inquiry</option>
            <option value="support">Support</option>
            <option value="feedback">Feedback</option>
            <option value="business">Business Proposal</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            placeholder="Type your message here..."
            required
          ></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
        <div class="success-message" id="successMessage">
          ✅ Your message has been sent successfully!
        </div>
      </form>
    </div>
    <script>
      const form = document.getElementById("contactForm");
      const successMessage = document.getElementById("successMessage");

      form.addEventListener("submit", async function (e) {
        e.preventDefault(); // Stop page reload

        const formData = new FormData(form);

        try {
          const response = await fetch(form.action, {
            method: form.method,
            body: formData,
          });

          if (response.ok) {
            successMessage.style.display = "block";
            form.reset();
          } else {
            alert("❌ Something went wrong. Please try again.");
          }
        } catch (error) {
          alert("❌ Network error. Please check your connection.");
        }
      });
    </script>
  </body>
</html>
